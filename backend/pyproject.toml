[project]
name = "tankwar-backend"
version = "1.0.0"
description = "FastAPI backend for TankWar OJ"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "pydantic>=2.8.2",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "httpx>=0.27.0",
  "ruff>=0.5.7"
]

[tool.uvicorn]
factory = false

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
