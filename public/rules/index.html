        <div class="column nav__container">
            <ol class="nav__container-item">

                </li>
                <li>
                    <a href="/" class="nav__item">Scoreboard</a>
                </li>
                <li>

                </li>
                <li>
                    <a href="/match" class="nav__item">Match</a>

                <li id="signin">
                    <a href="/oauth" class="nav__item">Login</a>
                </li>
            </ol>

    </div>
</nav>
<div class="slideout-panel" id="panel">
    <main class="tw-main">
        <div class="tw-wrap">
            <header class="tw-head">
                <div>
                    <p class="tw-head__eyebrow">VG101 2021 Fall &middot; Lab 7</p>
                    <h1 class="tw-head__title">Rules</h1>
                </div>
                <p class="tw-head__meta">
                    <a class="tw-link" href="/rules/v5.html">Tank War v5 (2v2 + items) rules &#8594;</a>
                    &middot; <a class="tw-link" href="/rules/details.html" target="_blank" rel="noopener">Open as a
                        separate page &#8599;</a>
                </p>
            </header>
            <article class="tw-card tw-rules-doc">
                <iframe src="/rules/details.html" title="Tank War lab handbook" height="5500" scrolling="no"
                        loading="eager"></iframe>
            </article>
        </div>
    </main>
    <div class="footer">
    </div>
</div>
<script src="/js/jsUtils/jsUtils.js"></script>
<script>
    require(["jquery", "/js/checkLogin"], function ($, check) {
        check().then(function (result) {
            if (result) {
                $("#signin").children().text(result).attr("href", "/profile");
            }
        });

        // The handbook is its own document; size the frame to fit it, again
        // whenever the width changes (text reflows) or its images load.
        var frame = $("iframe")[0];

        function fit() {
            try {
                var doc = frame.contentWindow.document;
                if (!doc || !doc.body) return;
                var h = Math.ceil(doc.body.getBoundingClientRect().height);
                if (Math.abs(h - frame.offsetHeight) > 1) frame.style.height = h + "px";
            } catch (e) {
            }
        }

        function watch() {
            fit();
            try {
                var doc = frame.contentWindow.document;
                $(doc).find("img").on("load", fit);
                if (window.ResizeObserver) new ResizeObserver(fit).observe(doc.body);
            } catch (e) {
            }
        }

        $(frame).on("load", watch);
        if (frame.contentWindow && frame.contentWindow.document.readyState === "complete" &&
            frame.contentWindow.location.href !== "about:blank") watch();

        var timer;
        $(window).on("resize", function () {
            clearTimeout(timer);
            timer = setTimeout(fit, 150);
        });
    });
</script>
</body>
</html>
